<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyClinic - Cadastrar Profissional</title>

    <link rel="stylesheet"
        href="../assets/css/cadastroProfissional.css">
</head>

<body>

    <div class="container">

        <aside class="sidebar">

            <h2>EasyClinic</h2>

            <nav>
                <ul>
                    <li>Início</li>
                    <li>Agenda</li>
                    <li>Pacientes</li>
                    <li class="ativo">Profissionais</li>
                </ul>
            </nav>

        </aside>

        <main class="conteudo">

            <div class="card-cadastro">

                <h1>Cadastrar Profissional</h1>

                <form>

                    <div class="campo">

                        <label for="nome">Nome</label>

                        <input
                            type="text"
                            id="nome"
                            placeholder="Nome do profissional">

                    </div>

                    <div class="campo">

                        <label for="especialidade">
                            Especialidade
                        </label>

                        <input
                            type="text"
                            id="especialidade"
                            placeholder="Especialidade">

                    </div>

                    <button
                        type="button"
                        id="btnCadastrarProfissional">

                        Cadastrar

                    </button>

                </form>

                <div class="voltar-link">

                    <p>

                        <a href="profissionais.html">

                            Voltar para Profissionais

                        </a>

                    </p>

                </div>

            </div>

        </main>

    </div>

    <script src="../assets/js/cadastroProfissional.js"></script>

</body>

</html>
