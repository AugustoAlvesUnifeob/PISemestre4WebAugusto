<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyClinic - Cadastrar Paciente</title>

    <link rel="stylesheet" href="../assets/css/cadastroPaciente.css">
</head>

<body>

    <div class="container">

        <aside class="sidebar">

            <h2>EasyClinic</h2>

            <nav>

                <ul>
                    <li>Início</li>
                    <li>Agenda</li>
                    <li class="ativo">Pacientes</li>
                    <li>Profissionais</li>
                </ul>

            </nav>

        </aside>

        <main class="conteudo">

            <div class="card-cadastro">

                <h1>Cadastrar Paciente</h1>

                <form method="post">

                    <div class="campo">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" placeholder="Nome completo do paciente">
                    </div>

                    <div class="campo">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" placeholder="Somente números">
                    </div>

                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" placeholder="(00) 00000-0000">
                    </div>

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="paciente@email.com">
                    </div>

                    <div class="campo">
                        <label for="complemento">Complemento</label>
                        <input type="text" id="complemento" placeholder="Observações adicionais">
                    </div>

                    <div class="campo">
                        <label for="tag">Tag</label>
                        <select id="tag">
                            <option value="">Selecione</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="plano">Plano</label>
                        <select id="plano">
                            <option value="">Selecione</option>
                        </select>
                    </div>

                    <button type="button" id="btnCadastrarPaciente">
                        Cadastrar
                    </button>

                </form>

                <div class="voltar-link">

                    <p>
                        <a href="pacientes.html">
                            Voltar para Pacientes
                        </a>
                    </p>

                </div>

            </div>

        </main>

    </div>

    <script src="../assets/js/cadastroPaciente.js"></script>

</body>

</html>
