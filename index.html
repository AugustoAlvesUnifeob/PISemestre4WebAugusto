<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyClinic - Login</title>

    <link rel="stylesheet" href="frontend/assets/css/login.css">
    <link rel="script" href="frontend/assets/js/login.js">
</head>

<body>

    <div class="container">

        <div class="lado-esquerdo">

            <div class="apresentacao">
                <h1>EasyClinic</h1>

                <p>
                    Sistema de Gestão para Clínicas
                </p>

            </div>

        </div>

        <div class="lado-direito">

            <div class="formulario">

                <h2>EasyClinic</h2>

                <form method="get">

                    <div class="campo">
                        <label for="email">E-mail</label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Digite seu e-mail">
                    </div>

                    <div class="campo">
                        <label for="senha">Senha</label>

                        <input
                            type="password"
                            id="senha"
                            placeholder="Digite sua senha">
                    </div>

                    <button type="button" id="btnEntrar">
                        Entrar
                    </button>

                </form>

                <div class="cadastro-link">

                    <p>
                        Novo usuário?
                        <a href="frontend/views/cadastro.html">
                            Começar agora
                        </a>
                    </p>

                </div>

            </div>

        </div>

    </div>

    <script src="frontend/assets/js/login.js"></script>

</body>

</html>
